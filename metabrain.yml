# Hummingbot API's run contract (FEAT-1304). See
# ~/Documents/metabrain/docs/projects-manifest.example.yml for every key.
#
# One service, deliberately no `port:` and no `per_workstream:` — same shape
# and same reason as Duma's `engine` (~/Documents/projects/duma/metabrain.yml).
# `api` holds real exchange credentials (bots/credentials/, conf_client.yml)
# and mounts the host Docker socket (docker-compose.yml:14) to launch bot
# containers; its container_name:s (hummingbot-api, hummingbot-broker,
# hummingbot-postgres) and ports (8000/1883/18083/5432) are fixed in the
# compose file, not parametrized by {port}. A workstream preview would
# either fight the live stack over those names/ports or need its own
# isolated credentials dir and compose project of its own — not something to
# wire up as a side effect of writing a manifest. A human decision to add
# previews against an isolated/paper account is a product call, not an
# infra one. Omitting `port:` is what keeps the run contract's `preview`
# rule at an informational SKIP instead of a blocking FAIL (no service would
# be "served" with no previewed copy otherwise).
#
# `emqx` (broker) and `postgres` are dependencies this service needs to run,
# not tracked here as services of their own (same treatment as DataRaptor's
# Mongo) — `api`'s own command brings them up: `postgres` via compose
# `depends_on`, `emqx` named explicitly since nothing in the compose file
# depends on it. `make emqx-auth` seeds the broker's bootstrap credentials
# file from .env before compose starts it, same as the Makefile's own
# `run`/`deploy` targets.

name: hummingbot-api

services:
  - name: api
    command: bash -c 'make emqx-auth && exec docker compose up hummingbot-api emqx'
    healthcheck:
      url: http://127.0.0.1:8000/
      expect: 200
