services:
  hummingbot-api:
    container_name: hummingbot-api
    image: hummingbot/hummingbot-api:latest
    restart: unless-stopped
    ports:
      # SEC: loopback by default — this API holds exchange credentials and can move funds,
      # and it was being scanned by external hosts when published on 0.0.0.0. Set API_BIND
      # in .env to widen it deliberately, and prefer a specific interface over 0.0.0.0:
      # with the Tailscale overlay, API_BIND=<tailscale-ip> keeps MagicDNS working without
      # offering the API to the public internet.
      - "${API_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./bots:/hummingbot-api/bots
      - /var/run/docker.sock:/var/run/docker.sock
      # Host metrics: mount the host's /proc read-only so the /system/resources
      # route reports HOST CPU/RAM/load instead of the container's.
      - /proc:/host/proc:ro
      # Disk usage probe: psutil.disk_usage() only stats the filesystem CONTAINING
      # this path, so a single non-sensitive host file on the root partition yields
      # the host root disk totals without exposing the host filesystem tree.
      - /etc/hostname:/host/disk-probe:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      # Override specific values for Docker networking
      - BROKER_HOST=emqx
      - DATABASE_URL=postgresql+asyncpg://hbot:hummingbot-api@postgres:5432/hummingbot_api
      # SEC-048: reach the secured Gateway container-to-container over the shared emqx-bridge
      # network (the Gateway container is attached to it on start). https + the 'gateway' cert SAN.
      # Note: the Gateway's host publish is bound to 127.0.0.1, so host.docker.internal can no
      # longer reach it — the in-network container name is the correct (and more secure) path.
      - GATEWAY_URL=https://gateway:15888
      # Point psutil at the mounted host paths (see volumes above)
      - HOST_PROC=/host/proc
      - HOST_DISK_PATH=/host/disk-probe
    extra_hosts:
      # Map host.docker.internal to host gateway for Linux compatibility
      # On macOS/Windows, Docker Desktop provides this automatically
      # On Linux, this maps to the docker bridge gateway IP
      - "host.docker.internal:host-gateway"
    networks:
      - emqx-bridge
    depends_on:
      - postgres
  emqx:
    container_name: hummingbot-broker
    image: emqx:5
    restart: unless-stopped
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=node1.emqx.local
      - EMQX_CLUSTER__DISCOVERY_STRATEGY=static
      - EMQX_CLUSTER__STATIC__SEEDS=[emqx@node1.emqx.local]
      - EMQX_LOADED_PLUGINS="emqx_recon,emqx_retainer,emqx_management,emqx_dashboard"
      # SEC: require username/password on every MQTT connection. EMQX ships with
      # `authentication = []` (anonymous allowed), which let anyone able to reach 1883
      # subscribe to `hbot/#` and publish `hbot/<instance_id>/stop` to halt a live bot.
      # Users are seeded from the bootstrap file generated by `make emqx-auth` out of
      # BROKER_USERNAME/BROKER_PASSWORD in .env.
      - EMQX_AUTHENTICATION__1__MECHANISM=password_based
      - EMQX_AUTHENTICATION__1__BACKEND=built_in_database
      - EMQX_AUTHENTICATION__1__USER_ID_TYPE=username
      - EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE=/opt/emqx/etc/auth-bootstrap.csv
      - EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE=plain
      # Dashboard admin password (default is the well-known admin/public). Deliberately
      # NOT BROKER_PASSWORD: that credential is handed to every bot instance's
      # conf_client.yml, and the dashboard grants full broker admin (rules, connectors),
      # not just the scoped MQTT access BROKER_PASSWORD is meant for.
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${BROKER_DASHBOARD_PASSWORD:-password}
      # SEC: deny topics no rule matches. Stock EMQX is no_match=allow with an ACL
      # ending in `{allow, all}`, so authentication alone still let any client read
      # `hbot/#` — every bot's orders, fills and balances. See emqx/acl.conf.
      - EMQX_AUTHORIZATION__NO_MATCH=deny
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - emqx-etc:/opt/emqx/etc
      # Generated by `make emqx-auth`; gitignored because it holds the broker password.
      - ./.emqx/auth-bootstrap.csv:/opt/emqx/etc/auth-bootstrap.csv:ro
      # Deny-by-default ACL, replacing the stock `{allow, all}` one.
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
    ports:
      # SEC: loopback-only. Bot containers run with network_mode="host" and reach the
      # broker at 127.0.0.1:1883; hummingbot-api reaches it in-network as emqx:1883.
      # Neither path needs the broker published on a routable interface — and with the
      # Tailscale overlay in play, 0.0.0.0 meant "reachable from the whole tailnet".
      - "127.0.0.1:1883:1883"  # mqtt:tcp
      - "127.0.0.1:18083:18083"  # http:dashboard
      # 8883 (mqtt:ssl), 8083/8084 (mqtt:ws), 8081 (http:management) and 61613 (web-stomp)
      # are not used by this project — conf_client.yml sets mqtt_ssl: false and the API
      # speaks plain TCP MQTT. Left unpublished to keep the attack surface minimal.
    networks:
      emqx-bridge:
        aliases:
          - node1.emqx.local
    healthcheck:
      test: [ "CMD", "/opt/emqx/bin/emqx_ctl", "status" ]
      interval: 5s
      timeout: 25s
      retries: 5
  postgres:
    container_name: hummingbot-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      # These variables automatically create the user and database on first initialization
      - POSTGRES_DB=hummingbot_api
      - POSTGRES_USER=hbot
      - POSTGRES_PASSWORD=hummingbot-api
      # Additional init parameters for better compatibility
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Init script as safety net - only runs on first initialization
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    # Loopback-only: only the hummingbot-api container talks to postgres,
    # and it does so over the emqx-bridge docker network, not this port.
    ports:
      # SEC: loopback by default. Only `make run` (source mode, uvicorn on the host) needs
      # this published at all; the containerised API reaches Postgres in-network.
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    networks:
      - emqx-bridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbot -d hummingbot_api"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  emqx-bridge:
    driver: bridge

volumes:
  emqx-data: { }
  emqx-log: { }
  emqx-etc: { }
  postgres-data: { }
