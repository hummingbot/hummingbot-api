name: Hummingbot-API CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      # Pinned to the version uv.lock was written with (matches the Dockerfile); bump deliberately.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run test suite
        run: make test

  lint:
    runs-on: ubuntu-latest
    # ARCH-127 reconciles the toolchain and clears the 296 existing flake8
    # violations; flip this to blocking as part of that item.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files
