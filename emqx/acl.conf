%%--------------------------------------------------------------------------------
%% hummingbot-api broker ACL — deny by default.
%%
%% Paired with EMQX_AUTHORIZATION__NO_MATCH=deny in docker-compose.yml. Stock EMQX
%% ships this file ending in `{allow, all}` with no_match = allow, which is why an
%% authenticated (or, before auth was enabled, anonymous) client could subscribe to
%% `hbot/#` and read every bot's order flow.
%%
%% NOTE: the broker account must NOT be a superuser — EMQX superusers bypass
%% authorization entirely. The bootstrap file written by `make emqx-auth` sets
%% is_superuser=false for exactly this reason.
%%
%% Rules are evaluated top to bottom; first match wins.
%%--------------------------------------------------------------------------------

%% The dashboard's own client needs broker telemetry.
{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.

%% Nobody gets the firehose or broker internals. Kept above the grant below so a
%% wildcard subscription can never be satisfied by it.
{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "+/#"}]}.

%% The API and every bot instance share one account. Bots publish telemetry and
%% subscribe to their command topics; the API does the inverse. Both live entirely
%% within these two prefixes -- kept in sync by hand with the topic strings in
%% utils/mqtt_manager.py (no shared constant ties the two together, so a renamed
%% or added topic there needs a matching edit here).
{allow, all, all, ["hbot/#", "hummingbot-api/response/#"]}.

%% Everything else is refused — including the arbitrary topics a rule-engine
%% backdoor would need to publish to in order to fire.
{deny, all}.
